plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// --- Multiversion configuration ---
// target_version selects the Minecraft/NeoForge version to build for.
// Allowed values: 26.1.2 (default), 26.2, 26.3
def target_version = project.findProperty('target_version') ?: '26.1.2'

// Resolve version-specific properties from gradle.properties (with _<version> suffix)
// Only Minecraft/Neo versions are overridden; compileOnly artifact deps use 26.1.2 jars
// (API-compatible across 26.x; actual runtime jars provided by the installed mods).
def mcVersion = project.findProperty("minecraft_version_${target_version}") ?: minecraft_version
def mcRange = project.findProperty("minecraft_version_range_${target_version}") ?: minecraft_version_range
def neoVersion = project.findProperty("neo_version_${target_version}") ?: neo_version

// Override the standard properties so the rest of the build uses the resolved values
minecraft_version = mcVersion
minecraft_version_range = mcRange
neo_version = neoVersion

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = 'https://repo.bluecolored.de/releases' }
    flatDir { dir 'libs' }
}

base {
    archivesName = "${mod_id}-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.flowpowered:flow-math:${flow_version}"
    implementation "maven.modrinth:placeholder-api-neoforge:${placeholder_api_version}"
    compileOnly "de.bluecolored:bluemap-api:${bluemap_api_version}"
    compileOnly "blank:${squaremap_artifact}"
    compileOnly "blank:Dynmap-3.9-SNAPSHOT-neoforge-26.1.2"
    compileOnly "blank:${tab_artifact}"
}

tasks.named('jar') {
    from(zipTree(file('libs/flow-math-1.0.3.jar'))) {
        include 'com/flowpowered/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// --- Configure source sets for multiversion ---
// Common code lives in src/main/java; version-specific overrides live in src/<version>/java
// target_version is like "26.1.2", "26.2", "26.3" -> dir names "26-1-2", "26-2", "26-2"
// (26.2 and 26.3 share the same API, so both use src/26-2/java)
def versionDir = target_version.replace('.', '-')
if (versionDir == '26-3') versionDir = '26-2'
sourceSets.main {
    java {
        srcDirs = ["src/main/java", "src/${versionDir}/java"]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
